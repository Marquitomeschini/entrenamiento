<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Entrenamiento</title>
<meta name="theme-color" content="#0c0b09">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gym">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&display=swap">
<style>
:root{--bg:#0c0b09;--sur:#161410;--sur2:#1e1b15;--line:#2a261d;--tx:#f2eee6;--mut:#a39c8c;--gold:#c9a84c;
--aprox:#1fb6c9;--biserie:#c9a84c;--superserie:#3b82f6;--serie-gigante:#e6d28a;--dropset:#d33b3b;--fallo:#e58a1f;
--desayuno:#c9a84c;--almuerzo:#3b82f6;--cena:#b06cf5;--disp:"Barlow Condensed",Impact,"Arial Narrow",sans-serif}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 -apple-system,system-ui,sans-serif;padding-bottom:calc(72px + env(safe-area-inset-bottom))}
a{color:inherit;text-decoration:none}
main{max-width:560px;margin:0 auto;padding:0 16px}
h1,h2{font-family:var(--disp);text-transform:uppercase;letter-spacing:.02em;margin:0;text-wrap:balance}
h1{font-size:40px;line-height:1;font-weight:800}h2{font-size:22px;font-weight:700;color:var(--gold);margin:28px 0 8px}
.eyebrow{display:block;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
.top{padding:calc(16px + env(safe-area-inset-top)) 0 12px}.back{display:inline-block;color:var(--gold);font-weight:600;margin-bottom:6px;min-height:44px;line-height:44px}
.hero{display:block;background:var(--sur);border:1px solid var(--line);border-left:4px solid var(--gold);padding:20px;margin:8px 0 20px}
.hero h1{margin:4px 0 12px}.hero .cta{color:var(--gold);font-weight:600}.hero.rest{border-left-color:var(--line)}.hero p{margin:0;color:var(--mut)}
.list{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.row{display:flex;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);min-height:56px;align-items:center}
.row.multi{border-left:3px solid var(--gold);padding-left:12px}
.row .names{display:flex;flex-direction:column;gap:4px;min-width:0}.row b{font-weight:600}.row .con{font-size:12px;color:var(--gold);font-weight:700}
.row .nums{display:flex;flex-direction:column;align-items:flex-end;text-align:right;flex-shrink:0;font-variant-numeric:tabular-nums;max-width:45%}
.row .ser{font-family:var(--disp);font-size:26px;font-weight:800;line-height:1}.row .reps,.row .desc{font-size:12px;color:var(--mut)}.row .desc{color:var(--gold)}
.row .play{color:var(--gold);font-size:18px;flex-shrink:0}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.b{font:700 10px/1 system-ui;letter-spacing:.08em;padding:5px 7px;border-radius:3px;color:#0c0b09;background:var(--mut);text-transform:uppercase;font-style:normal}
.b-aprox{background:var(--aprox)}.b-biserie{background:var(--biserie)}.b-superserie{background:var(--superserie);color:#fff}.b-serie-gigante{background:var(--serie-gigante)}.b-dropset{background:var(--dropset);color:#fff}.b-fallo{background:var(--fallo)}
.cardio{background:var(--sur);border:1px solid var(--line);padding:16px;margin-top:28px}.cardio h2{margin:0 0 2px}.cardio .sub{margin:0 0 12px;color:var(--mut);font-size:13px}
.cardio ol{list-style:none;margin:0;padding:0;counter-reset:p}.cardio li{display:grid;grid-template-columns:28px 1fr auto;gap:2px 10px;padding:10px 0;border-top:1px solid var(--line);counter-increment:p}
.cardio li::before{content:counter(p);font-family:var(--disp);font-weight:800;color:var(--gold);font-size:20px;grid-row:span 2}.cardio li b{font-weight:600}.cardio li small{grid-column:2;color:var(--mut);font-size:13px}.cardio .dosis{color:var(--gold);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.spec{display:flex;gap:16px;flex-wrap:wrap;margin:6px 0 8px;color:var(--mut);font-size:14px;align-items:baseline}.spec b{color:var(--tx);font-family:var(--disp);font-size:22px;font-weight:800}
.ej{margin-top:20px}.ej h2{color:var(--tx);margin:12px 0 4px}.nota{margin:0 0 10px;color:var(--mut);font-size:14px}.ult{margin:0 0 8px;color:var(--gold);font-size:14px;font-variant-numeric:tabular-nums}
.vid{aspect-ratio:9/16;max-height:62vh;margin:0 auto;background:#000;border:1px solid var(--line)}.vid video{width:100%;height:100%;display:block;object-fit:contain}
.novideo{padding:18px;background:var(--sur);border:1px dashed var(--line);color:var(--mut);text-align:center;font-size:14px}
.log{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}.log th{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);font-weight:600;text-align:left;padding:4px 6px}
.log td{padding:4px 6px;border-top:1px solid var(--line)}.log td:first-child{width:52px;color:var(--gold);font-family:var(--disp);font-size:20px;font-weight:800}
.log input{width:100%;min-height:44px;background:var(--sur2);border:1px solid var(--line);color:var(--tx);font:18px system-ui;padding:6px 10px;border-radius:4px}.log input:focus{outline:2px solid var(--gold);outline-offset:-1px}
.actions{display:flex;flex-direction:column;gap:10px;margin:24px 0 8px}
.btn{display:block;min-height:52px;line-height:52px;text-align:center;background:var(--gold);color:#0c0b09;font:700 17px system-ui;border:0;border-radius:6px;cursor:pointer;width:100%}
.btn.ghost{background:transparent;color:var(--gold);border:1px solid var(--gold)}.btn:focus-visible{outline:3px solid #fff}
.macros{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);margin:12px 0}.macros div{background:var(--sur);padding:12px;text-align:center}.macros small{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}.macros b{font-family:var(--disp);font-size:26px;font-weight:800}
.meal h2 small{font-family:system-ui;text-transform:none;letter-spacing:0;font-size:13px;color:var(--mut);margin-left:8px;font-weight:400}
.m-desayuno h2{color:var(--desayuno)}.m-almuerzo h2{color:var(--almuerzo)}.m-cena h2{color:var(--cena)}
details{border:1px solid var(--line);background:var(--sur);margin-bottom:8px}summary{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px;padding:12px 14px;cursor:pointer;min-height:44px;list-style:none}summary::-webkit-details-marker{display:none}
summary b{font-weight:600}summary span{color:var(--gold);font-variant-numeric:tabular-nums}summary small{width:100%;color:var(--mut);font-size:12px}
details ul{margin:0;padding:0 14px 12px 30px;color:var(--tx)}details li{padding:3px 0}
.reglas{margin:0}.reglas dt{margin-top:14px;font-weight:700;color:var(--gold);text-transform:uppercase;font-size:12px;letter-spacing:.1em}.reglas dd{margin:4px 0 0;color:var(--tx)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--sur);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav a{flex:1;text-align:center;padding:10px 0 8px;min-height:56px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);font-weight:600}
nav a .ic{display:block;font-family:var(--disp);font-size:22px;line-height:1;margin-bottom:4px;font-weight:800}nav a.on{color:var(--gold)}
#timer[hidden]{display:none}#timer{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;z-index:9}
#timer b{font-family:var(--disp);font-size:120px;line-height:1;font-weight:800;font-variant-numeric:tabular-nums}#timer.done{background:var(--dropset)}#timer.done b{color:#fff}
#timer .btn{width:min(320px,80vw)}#timer small{color:var(--gold);letter-spacing:.08em;text-transform:uppercase;font-size:16px;font-weight:700;text-align:center;padding:0 24px}
#t-next{color:var(--mut);margin:0;min-height:1.4em;text-align:center;padding:0 24px}#timer.reps b{font-size:64px}#timer.done small{color:#fff}#timer.done #t-next{color:#fff}
.chk{width:44px;height:44px;border-radius:6px;border:1px solid var(--line);background:var(--sur2);color:var(--mut);font-size:20px;cursor:pointer}.chk.on{background:var(--gold);color:#0c0b09;border-color:var(--gold)}.chk:focus-visible{outline:2px solid #fff}
.log td:last-child{width:52px;padding-right:0}tr.done td{opacity:.55}tr.done td:last-child{opacity:1}
.row.hecho .names{opacity:.5}.row.hecho .play{color:var(--gold);font-size:22px}
.nota-libre{width:100%;min-height:44px;margin-top:10px;background:var(--sur2);border:1px solid var(--line);color:var(--tx);font:15px system-ui;padding:10px;border-radius:4px;resize:vertical}.nota-libre:focus{outline:2px solid var(--gold);outline-offset:-1px}
.cardio .actions{margin:16px 0 0}
.prog{display:flex;align-items:center;gap:10px;margin:2px 0 8px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}.prog i{flex:1;height:3px;background:var(--line);border-radius:2px;overflow:hidden}.prog i b{display:block;height:100%;background:var(--gold)}
.log td:first-child small{display:block;font:600 11px system-ui;color:var(--mut);letter-spacing:.04em;margin-top:-2px}
tr.aprox td:first-child{color:var(--aprox);font-size:16px}tr.aprox td:first-child small{color:var(--aprox)}
tr.especial td:first-child{color:var(--dropset)}tr.especial td:first-child small{color:var(--dropset)}
tr.drop td{border-top:0;padding-top:0}tr.drop td:first-child{font:600 12px system-ui;color:var(--dropset)}
tr.ahora{box-shadow:inset 3px 0 var(--gold)}tr.ahora td:first-child{padding-left:9px}
.guia{background:var(--sur);border:1px solid var(--line);border-left:3px solid var(--gold);padding:10px 12px;font-size:14px;margin-top:12px;line-height:1.35}.guia b{color:var(--gold)}
.b[data-tec]{cursor:pointer}
#tec{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:8;display:flex;align-items:flex-end}#tec[hidden]{display:none}
.sheet{background:var(--sur);border-top:1px solid var(--line);width:100%;max-width:560px;margin:0 auto;padding:20px 16px calc(20px + env(safe-area-inset-bottom))}.sheet p{margin:12px 0 16px;font-size:16px}
@media(prefers-reduced-motion:no-preference){#timer.done{animation:flash .6s 3}@keyframes flash{50%{background:var(--bg)}}}
</style>
</head>
<body>
<main id="view"></main>
<div id="timer" hidden><small id="t-label">Descanso</small><b>0:00</b><p id="t-next"></p><button class="btn" id="timer-main">Listo</button><button class="btn ghost" id="timer-skip" hidden>Saltar</button></div>
<div id="tec" hidden><div class="sheet"><i class="b" id="tec-b"></i><p id="tec-t"></p><button class="btn ghost" id="tec-close">Cerrar</button></div></div>
<nav>
  <a href="#/rutina" data-tab="rutina"><span class="ic">R</span>Rutina</a>
  <a href="#/videos" data-tab="videos"><span class="ic">▶</span>Videos</a>
  <a href="#/comida" data-tab="comida"><span class="ic">K</span>Comida</a>
  <a href="#/tecnicas" data-tab="tecnicas"><span class="ic">?</span>Técnicas</a>
</nav>
<script src="data.js"></script>
<script src="util.js"></script>
<script src="store.js"></script>
<script src="timer.js"></script>
<script src="app.js"></script>
<script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});</script>
</body>
</html>
